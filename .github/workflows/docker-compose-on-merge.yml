name: CI/CD Docker Compose on Self-Hosted Runner

on:
  push:
    branches: [dev, prod]

permissions:
  contents: read
  id-token: write
  statuses: write
  security-events: write

jobs:
  deployment:
    runs-on: self-hosted

    steps:
      - name: Block direct pushes to dev/prod (allow merges only)
        if: ${{ !startsWith(github.event.head_commit.message, 'Merge') }}
        run: |
          echo "Direct pushes to dev or prod are not allowed. Please use pull requests and merge only."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run GitHub Super-Linter
        uses: super-linter/super-linter@v8.0.0
        continue-on-error: true
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: dev
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



      - name: Run Python unit tests
        run: |
          python3 -m venv venv
          . venv/bin/activate
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          python3 -m unittest discover -s backend -p 'test_*.py'

      - name: Run Docker Compose
        run: |
          docker compose -f docker-compose.yml up -d --build
