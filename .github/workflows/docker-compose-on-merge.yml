name: CI/CD Docker Compose on Self-Hosted Runner

on:
  push:
    branches: [dev, prod]

jobs:
  check-merge:
    runs-on: self-hosted

    steps:
      - name: Block direct pushes to dev/prod (allow merges only)
        if: ${{ !startsWith(github.event.head_commit.message, 'Merge') }}
        run: |
          echo "Direct pushes to dev or prod are not allowed. Please use pull requests and merge only."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run GitHub Super-Linter
        uses: super-linter/super-linter@v8.0.0
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: dev
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python,javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # ---------- TRIVY VIA DOCKER (no marketplace action) ----------
      - name: Trivy config scan (docker-compose.yml)
        run: |
          docker pull aquasec/trivy:latest
          docker run --rm \
            -v "$PWD:/repo" \
            -v trivy-cache:/root/.cache/ \
            aquasec/trivy:latest \
            config --format table --exit-code 1 --severity CRITICAL,HIGH /repo/docker-compose.yml

      - name: Build images with Docker Compose
        run: |
          docker compose -f docker-compose.yml build

      # If you know your image tags, list them explicitly (recommended)
      - name: Trivy image scan (built images)
        env:
          IMAGES: "your-backend-image:latest your-frontend-image:latest"
        run: |
          for IMG in $IMAGES; do
            echo "Scanning $IMG..."
            docker run --rm \
              -v trivy-cache:/root/.cache/ \
              aquasec/trivy:latest \
              image --format table --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH "$IMG"
          done
      # ---------------------------------------------------------------

      - name: Run Python unit tests
        run: |
          pip install -r backend/requirements.txt
          python3 -m unittest discover -s backend -p 'test_*.py'

      - name: Run Docker Compose
        run: |
          docker compose -f docker-compose.yml up -d --build
