name: CI/CD Docker Compose on Self-Hosted Runner

on:
  push:
    branches: [dev, prod]

jobs:
  check-merge:
    runs-on: self-hosted

    steps:
      # Use the push event payload instead of shelling out to git
      - name: Block direct pushes to dev/prod (allow merges only)
        if: ${{ !startsWith(github.event.head_commit.message, 'Merge') }}
        run: |
          echo "Direct pushes to dev or prod are not allowed. Please use pull requests and merge only."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run GitHub Super-Linter
        uses: super-linter/super-linter@v8.0.0
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: dev
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python,javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      # Trivy for docker-compose (IaC) misconfig scan
      - name: Trivy scan docker-compose.yml (IaC)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: docker-compose.yaml
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # (Optional) Trivy image scan if you build images in this pipeline
      # - name: Trivy scan built image
      #   uses: aquasecurity/trivy-action@0.28.0
      #   with:
      #     scan-type: image
      #     image-ref: your-image:tag
      #     format: table
      #     exit-code: 1
      #     ignore-unfixed: true
      #     severity: CRITICAL,HIGH

      - name: Run Python unit tests
        run: |
          pip install -r backend/requirements.txt
          python3 -m unittest discover -s backend -p 'test_*.py'

      - name: Run Docker Compose
        run: |
          docker compose -f docker-compose.yml up -d --build
