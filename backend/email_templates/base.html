<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ email_title }} - ExpreeZmeal</title>
    <style>
        /* Email-safe CSS */
        .email-container {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px 10px 0 0;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 10px 0 0 0;
            font-size: 18px;
        }

        .content {
            background: white;
            padding: 30px;
            border: 1px solid #ddd;
            border-radius: 0 0 10px 10px;
        }

        .content h2 {
            color: #667eea;
            margin-top: 0;
        }

        .info-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .info-box h3 {
            margin-top: 0;
            color: #333;
        }

        .summary-box {
            background: #667eea;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .summary-box h3 {
            margin-top: 0;
        }

        .pickup-location {
            background: #e8f5e8;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #28a745;
            margin: 20px 0;
        }

        .pickup-location h3 {
            margin-top: 0;
            color: #155724;
        }

        .pickup-location p {
            margin: 5px 0;
            color: #155724;
        }

        .footer {
            border-top: 1px solid #eee;
            padding-top: 20px;
            text-align: center;
            color: #666;
        }

        .footer a {
            color: #667eea;
        }

        .footer .thanks {
            margin-top: 15px;
        }

        .status-alert {
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin: 20px 0;
            color: white;
            font-weight: bold;
        }

        .btn {
            background: #667eea;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            display: inline-block;
        }

        .item-row {
            border-bottom: 1px solid #eee;
            padding: 10px 0;
        }

        .item-row h4 {
            margin: 0;
            color: #333;
        }

        .item-row p {
            margin: 5px 0;
            color: #666;
        }

        .customizations {
            margin: 5px 0;
            color: #888;
            font-size: 14px;
        }

        .order-status {
            color: #28a745;
            font-weight: bold;
        }

        .items-section {
            margin: 25px 0;
        }

        .items-title {
            color: #333;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 18px;
            font-weight: bold;
            border-top: 1px solid rgba(255,255,255,0.3);
            padding-top: 10px;
        }

        .center-text {
            text-align: center;
            margin: 30px 0;
        }

        .notification-text {
            font-size: 16px;
            color: #666;
        }

        .status-message {
            margin: 0;
            font-size: 20px;
        }

        .status-text {
            font-weight: bold;
        }

        .item-image {
            max-width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }

        .item-title {
            margin-top: 0;
            color: #333;
            font-size: 24px;
        }

        .item-description {
            color: #666;
            font-size: 16px;
            margin: 10px 0;
        }

        .item-price {
            color: #667eea;
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
        }

        .footer-section {
            border-top: 1px solid #eee;
            padding-top: 20px;
            text-align: center;
            color: #666;
        }

        .thank-you {
            margin-top: 15px;
        }

        .warning-box {
            background: #fff3cd;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #ffc107;
            margin: 20px 0;
        }

        .warning-title {
            margin-top: 0;
            color: #856404;
        }

        .warning-text {
            margin: 5px 0;
            color: #856404;
        }

        .thank-you-message {
            font-size: 18px;
            color: #667eea;
            font-weight: bold;
        }

        .promo-code {
            color: #667eea;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <h1>🍖 ExpreeZmeal</h1>
            <p>{{ header_subtitle }}</p>
        </div>

        <div class="content">
            {% block content %}
            <!-- Template content goes here -->
            {% endblock %}

            <div class="footer">
                <p>Questions? Contact us at <a href="mailto:{{ support_email }}">{{ support_email }}</a></p>
                <p class="thanks">Thank you for choosing ExpreeZmeal! 🙏</p>
            </div>
        </div>
    </div>
</body>
</html>
