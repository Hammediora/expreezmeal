{% extends "base.html" %}

{% block content %}
<h2>🎉 Something Delicious is Here!</h2>

<div class="center-text">
    <img src="{{ item_image_url }}" alt="{{ item_name }}" class="item-image" />
</div>

<div class="info-box center-text">
    <h3 class="item-title">{{ item_name }}</h3>
    <p class="item-description">{{ item_description }}</p>
    <p class="item-price">${{ "%.2f"|format(item_price / 100) }}</p>
</div>

<div class="center-text">
    <a href="{{ menu_url }}" class="btn">🛍️ Order Now</a>
</div>

<div class="footer-section">
    <p>Don't miss out on this amazing new addition to our menu!</p>
    <p class="thank-you">Thank you for being a valued customer! 🙏</p>
</div>
{% endblock %}
